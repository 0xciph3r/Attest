name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Unit tests (race)
        run: make race
      - name: End-to-end tests
        run: make e2e
      - name: Static Linux builds
        run: make linux

  tpm:
    # Attestation against a real TPM 2.0 implementation (swtpm in Docker).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start swtpm
        run: make swtpm-up
      - name: TPM integration tests
        run: make test-tpm
      - name: swtpm logs
        if: failure()
        run: docker logs attest-swtpm || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make vuln
